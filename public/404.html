<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Immersyn</title>
    <script>
      // GitHub Pages has no SPA rewrite: it serves this file for unknown paths.
      // Bounce to /?/path so index.html can decode it back into a real route.
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        "/?/" +
        l.pathname.slice(1).replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
