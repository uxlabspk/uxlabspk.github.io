---
layout: default
---

<article class="project">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {% if page.tech %}{% for t in page.tech %}<span class="tag">{{ t }}</span
      >{% endfor %}{% endif %}
    </p>
    <div class="project-actions">
      {% if page.github %}<a
        class="button button-primary"
        href="{{ page.github }}"
        target="_blank"
        rel="noopener"
        >View on GitHub <span aria-hidden="true">↗</span></a
      >{% endif %}{% if page.demo %}<a
        class="button button-outline"
        href="{{ page.demo }}"
        target="_blank"
        rel="noopener"
        >Live Demo <span aria-hidden="true">↗</span></a
      >{% endif %}
    </div>
  </header>
  <div class="post-content">{{ content }}</div>
</article>

<a class="back-link" href="{{ '/projects/' | relative_url }}"
  >&larr; Back to all projects</a
>
